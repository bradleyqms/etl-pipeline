name: Deploy to Azure Functions (ETL)

# ──────────────────────────────────────────────
# Deploys: func-qms-etl-prod  (Flex Consumption plan)
# Triggers: push to main, or manual dispatch
#
# Flex Consumption notes:
#   - Uses Kudu ZIP deploy (One Deploy), NOT remote build
#   - host.json MUST be at zip root
#   - All pip packages MUST be pre-installed in the package
#   - Auth via RBAC (Azure/login) — no publish profile needed
# ──────────────────────────────────────────────

on:
  push:
    branches: [main]
    paths:
      - 'azure_functions/**'
      - 'src/**'
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_NAME: func-qms-etl-prod
  PYTHON_VERSION: '3.11'

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build deployment package
        shell: bash
        run: |
          # Create a clean staging directory with host.json at root
          mkdir -p deploy_package

          # Copy Azure Functions files (host.json, function_app.py, requirements.txt)
          cp azure_functions/function_app.py deploy_package/
          cp azure_functions/host.json deploy_package/
          cp azure_functions/requirements.txt deploy_package/

          # Copy src/ package so function_app.py can import it
          cp -r src/ deploy_package/src/

          # Create an empty .env so load_dotenv() doesn't crash
          # (real values come from Application Settings in Azure)
          touch deploy_package/.env

          # Install pip packages INTO the package (Flex Consumption has no remote build)
          cd deploy_package
          pip install -r requirements.txt --target=".python_packages/lib/site-packages" --quiet
          cd ..

          echo "=== Deployment package contents ==="
          find deploy_package -maxdepth 3 -type f | head -40
          echo "=== host.json at root? ==="
          ls -la deploy_package/host.json

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_06062EA8B92241BD85356990079EB186 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_1B966D2E372E41C582B57904B3E5A76A }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_3AB09D74AB2B479890FB7529CE850BFE }}

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: deploy_package
          scm-do-build-during-deployment: false
          enable-oryx-build: false
