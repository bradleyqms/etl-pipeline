name: Deploy to Azure Functions (ETL)

# ──────────────────────────────────────────────
# Deploys: func-qms-etl-prod
# Triggers: push to main, or manual dispatch
# ──────────────────────────────────────────────

on:
  push:
    branches: [main]
    paths:
      - 'azure_functions/**'
      - 'src/**'
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_NAME: func-qms-etl-prod
  PYTHON_VERSION: '3.11'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        shell: bash
        run: |
          pushd azure_functions
          python -m pip install --upgrade pip
          pip install -r requirements.txt --target=".python_packages/lib/site-packages"
          popd

      - name: Prepare deployment package
        shell: bash
        run: |
          # Copy src/ package into azure_functions/ so function_app.py can import it
          cp -r src/ azure_functions/src/

          # Create an empty .env so load_dotenv() doesn't crash
          # (real values come from Application Settings)
          touch azure_functions/.env

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: azure_functions
          publish-profile: ${{ secrets.AZURE_FUNCTIONS_PUBLISH_PROFILE }}
          scm-do-build-during-deployment: true
          enable-oryx-build: true
